include:
  - '.gitlab/config.yml'

variables:
  SERVER_TAG: "Gem12Server"

stages:
  - test_gpu
  - prepare
  - unit_tests
  - train
  - clean_up

test_gpu:
  stage: test_gpu
  only:
    - web
    #- schedules # for nightly, not yet implemented
  script:
    - echo "Checking GPU..."
    - nvidia-smi
  tags:
    - $SERVER_TAG

prepare:
  stage: prepare
  tags:
    - $SERVER_TAG
  script:
    - echo "Preparing repository..."
    - |
      if (Test-Path "${CI_PROJECT_DIR}/.git") {
          # Repository exists - update it
          echo "Repository already exists, updating..."
          cd ${CI_PROJECT_DIR}
          git fetch origin
          git checkout ${CI_COMMIT_REF_NAME}
          git reset --hard origin/${CI_COMMIT_REF_NAME}
          echo "Repository updated"
      } else {
          # Repository doesn't exist - clone it
          echo "Cloning fresh repository..."
          git clone https://github.com/PMQ9/Mixture-of-Experts_Research.git ${CI_PROJECT_DIR}
          cd ${CI_PROJECT_DIR}
          git checkout ${CI_COMMIT_REF_NAME}
          git reset --hard origin/${CI_COMMIT_REF_NAME}
          echo "Repository cloned"
      }
    - echo "Repository ready at ${CI_PROJECT_DIR}"
  timeout: 30m

unit_tests:
  stage: unit_tests
  only:
    - web
  script:
    - echo "Running unit and regression tests..."
    - cd ${CI_PROJECT_DIR}
    - pip install --upgrade pip
    - pip install pytest torch torchvision
    - "& 'C:\\Users\\phamm\\AppData\\Local\\Programs\\Python\\Python310\\python.exe' -m pytest tests/ -m unit -v --tb=short" | Tee-Object -FilePath 'artifacts/unit_tests_log.txt'
    - echo "Unit tests completed!"
  artifacts:
    paths:
      - artifacts/unit_tests_log.txt
    reports:
      junit: artifacts/junit.xml
    when: always
    expire_in: 2 weeks
  allow_failure: false
  dependencies:
    - prepare
  tags:
    - $SERVER_TAG
  timeout: 30m

train:
  stage: train
  only:
    - web
    #- schedules # for nightly, not yet implemented
  script:
    - echo "Starting training..."
    - cd ${CI_PROJECT_DIR}
    - mkdir -Force artifacts
    #- "& 'C:\\Users\\phamm\\AppData\\Local\\Programs\\Python\\Python310\\python.exe' 'src/Vision_Transformer_Pytorch/train_moe.py' *> 'artifacts/pipeline_log.txt'" # 2 typos
    - "& 'C:\\Users\\phamm\\AppData\\Local\\Programs\\Python\\Python310\\python.exe' 'src/Vision_Transformer_Pytorch/train_moe.py' | Tee-Object -FilePath 'artifacts/pipeline_log.txt'"    
    - echo "Training complete!"
  dependencies:
    - test_gpu
    - prepare
    - unit_tests
  artifacts:
    paths:
      - artifacts/training_log.txt 
      - artifacts/pipeline_log.png
      - artifacts/training_metrics.png
      - artifacts/vit_cifar10_best.pth
      - artifacts/vit_gtsrb_best.pth
    when: always
    expire_in: 1 week
  tags:
    - $SERVER_TAG
  #only:
    #- schedules
  timeout: 36h

clean_up  :
  stage: clean_up
  only:
    - web
  script:
    - echo "Cleaning Up..." # Not yet implemented
  tags:
    - $SERVER_TAG