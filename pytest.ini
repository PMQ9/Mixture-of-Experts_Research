[pytest]
# Pytest configuration for Mixture-of-Experts project

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -ra

# Markers for test categorization
markers =
    unit: Unit tests that don't require external resources
    integration: Integration tests that may require datasets
    regression: Regression tests to ensure consistency
    slow: Tests that take significant time to run
    gpu: Tests that require GPU
    cifar10: Tests that use CIFAR-10 dataset
    mnist: Tests that use MNIST dataset
    gtsrb: Tests that use GTSRB dataset

# Test paths
testpaths = tests

# Coverage options
# Uncomment to enable coverage reporting
# addopts = --cov=src --cov-report=html --cov-report=term

# Timeout for tests (in seconds)
# Uncomment to enable test timeouts
# timeout = 300

# Minimum Python version
minversion = 3.8
